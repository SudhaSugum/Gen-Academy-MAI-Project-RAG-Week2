[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-triage-assistant"
version = "0.1.0"
description = "Evidence-grounded, human-reviewed audit issue triage and RAU scoping"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.66.1",
  "langchain-core==1.6.10",
  "langchain-openai==1.7.2",
  "langchain-pinecone==0.2.13",
  "langchain-text-splitters==1.1.3",
  "langgraph==1.2.17",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-checkpoint-postgres==3.2.0",
  "pinecone==7.3.0",
  "mem0ai==2.2.1",
  "pydantic==2.13.5",
  "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.2.12",
  "python-dotenv==1.1.1",
  "python-docx==1.2.0",
  "pypdf==6.1.3",
  "reportlab==4.4.4",
]

[tool.setuptools.packages.find]
include = ["src*"]
